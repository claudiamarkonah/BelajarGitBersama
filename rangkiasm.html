<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #c00;
            color: #fff;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #900;
        }
        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #c00;
        }
    </style>
</head>
<body>
    <h1>name rangki</h1>
    <p>rangki suka belajar matematika, logic, dan aktivitas creating</p>
    <h3>rangki favourite game <span>ULTRAKILL</span></h3>
    <img src="https://www.reddit.com/media?url=https%3A%2F%2Fi.redd.it%2F5od761khh5ah1.gif" alt="ultrakill v1" width="300">

    <hr>

    <h3>Random ULTRAKILL Character</h3>
    <button onclick="getRandomCharacter()">Roll Character</button>
    <div id="result">Press the button to roll!</div>

    <script>
        const characters = ["V1", "V2", "Gabriel", "Minos", "Sisyphus"];

        function getRandomCharacter() {
            const randomIndex = Math.floor(Math.random() * characters.length);
            document.getElementById("result").textContent = characters[randomIndex];
        }
    </script>
</body>
</html>
